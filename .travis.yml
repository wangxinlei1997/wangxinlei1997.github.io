sudo: false
language: node_js
install:
  - npm ci
node_js:
  - 22 # Hexo 8 runtime
cache: npm
branches:
  only:
    - master # build master branch only
script:
  - npm run build # generate static files
deploy:
  provider: pages
  skip-cleanup: true
  github-token: $GH_TOKEN
  keep-history: true
  on:
    branch: master
  local-dir: public